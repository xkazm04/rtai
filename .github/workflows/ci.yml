# STANDARDS TST-04: lint, import, tests, native matrix, Windows export + PCK audit, on every push.
# Never needs a Steam client, never writes steam_appid.txt, never sees the publisher key (TST-07).
# Not yet run remotely: the repo has no GitHub remote at bootstrap (2026-11-02).
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install "gdtoolkit==$(sed -n '/^\[gdtoolkit\]/,/^\[/s/^version = "\(.*\)"/\1/p' versions.toml)"
      - run: node tools/lint/lint.mjs

  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/setup-godot
      - run: '"$GODOT_BIN" --headless --path project --import'
      - name: load every script (import exits 0 even when scripts fail to compile)
        run: '"$GODOT_BIN" --headless --path project -s res://tests/load_all.gd'
      - name: reimport-clean check
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-godot
      - run: node tools/tests/run_unit.mjs
      - run: '"$GODOT_BIN" --headless --path project -s res://tests/run_scenarios.gd'

  native:
    # NAT-05 / NAT-06: MSVC template_debug + template_release, the standalone sim_core tests, then
    # the parity gate (native CitySim vs the GDScript reference, bit-identical) on Windows.
    # DEVIATION NAT-05 (docs/decisions.md): the Linux debug build under ASan/UBSan is not in CI yet.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons
      - name: build the GDExtension (debug + release) and the standalone core tests
        working-directory: native
        shell: bash
        run: |
          scons platform=windows arch=x86_64 target=template_debug
          scons platform=windows arch=x86_64 target=template_release
          scons platform=windows arch=x86_64 tests
      - name: sim_core standalone tests
        shell: bash
        run: native/build/tests/sim_core_tests.exe
      - name: fetch the pinned Godot (Windows)
        shell: bash
        run: |
          set -euo pipefail
          URL=$(sed -n 's/^windows_url = "\(.*\)"/\1/p' versions.toml)
          SHA=$(sed -n 's/^windows_sha512 = "\(.*\)"/\1/p' versions.toml)
          curl -fsSL "$URL" -o "$RUNNER_TEMP/godot.zip"
          echo "$SHA  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          BIN=$(ls "$RUNNER_TEMP"/godot/*_console.exe)
          "$BIN" --version
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
      - name: parity gate (native vs GDScript reference)
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path project --import
          "$GODOT_BIN" --headless --path project -s res://tests/parity/run_parity.gd

  export:
    # Stub until the first export ticket lands tools/pck_audit (EXP-04/05).
    runs-on: windows-latest
    steps:
      - run: echo "::warning::Windows export + PCK audit not implemented yet (DEVIATION TST-04)"

  evidence:
    # Writes pof.godot-evidence/1 for this commit and keeps it as a build artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install "gdtoolkit==$(sed -n '/^\[gdtoolkit\]/,/^\[/s/^version = "\(.*\)"/\1/p' versions.toml)"
      - uses: ./.github/actions/setup-godot
      # Parity runs in the Windows native job and the bench needs Windows + a display, so this
      # Linux job writes lint, unit-tests and scenario-tests only (the others stay stale, not faked).
      - run: node tools/evidence/run.mjs --no-parity --no-bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.sha }}
          path: build/evidence/
